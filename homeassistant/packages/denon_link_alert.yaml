# Home Assistant package: power-cycles the Denon and alerts the phone when the
# ESP32 loses control of it.
# Install: copy to <HA config>/packages/ and add to configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# Set denon_state_url in secrets.yaml to the ESP32's /api/state URL.
# Replace notify.notify with your phone's notify service (notify.mobile_app_<device>).
# Replace switch.denon_power with the smart socket that powers the Denon.

rest:
  - resource: !secret denon_state_url
    scan_interval: 10
    timeout: 5
    binary_sensor:
      - name: Denon Bluetooth link
        unique_id: denon_app_volume_bluetooth_link
        device_class: connectivity
        # A maintenance boot runs without Bluetooth on purpose; report the link
        # as up so it causes no alert or power cycle until the normal boot.
        value_template: >-
          {{ value_json.connected | default(false) or
             value_json.maintenance | default(false) }}
      - name: Denon ESP32 maintenance
        unique_id: denon_app_volume_maintenance
        value_template: "{{ value_json.maintenance | default(false) }}"

template:
  # Tracks the current outage from its first non-up state, so brief
  # unavailable gaps (which reset the link sensor's last_changed) keep it.
  - triggers:
      - trigger: state
        entity_id: binary_sensor.denon_bluetooth_link
      # A reload restores the previous state, so it needs no trigger here.
      - trigger: homeassistant
        event: start
    binary_sensor:
      - name: Denon link outage
        unique_id: denon_app_volume_link_outage
        state: "{{ not is_state('binary_sensor.denon_bluetooth_link', 'on') }}"
        attributes:
          since: >-
            {%- if is_state('binary_sensor.denon_bluetooth_link', 'on') -%}
              {{ none }}
            {%- elif this.state == 'on' and this.attributes.since -%}
              {{ this.attributes.since }}
            {%- else -%}
              {{ now().isoformat() }}
            {%- endif -%}

automation:
  # The receiver refuses new Bluetooth links until its power is cycled
  # (README: Reset and re-pair), so cut its smart socket for 1 second.
  - id: denon_link_power_cycle
    alias: Denon link power cycle
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.denon_bluetooth_link
        to: "off"
        for: "00:00:30"
      # A drop inside the cooldown has no later state change, so recheck.
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: binary_sensor.denon_bluetooth_link
        state: "off"
        for: "00:00:30"
      # Leave a socket that was switched off on purpose alone.
      - condition: state
        entity_id: switch.denon_power
        state: "on"
      # The link flaps between off and unavailable while the ESP32 recovers;
      # cycle at most once per 10 minutes, then hourly after an hour down.
      - condition: template
        value_template: >-
          {% set since = state_attr('binary_sensor.denon_link_outage', 'since') | as_datetime(none) %}
          {% set down = now() - since if since else timedelta(0) %}
          {% set cooldown = timedelta(minutes=10) if down < timedelta(hours=1) else timedelta(hours=1) %}
          {{ this.attributes.last_triggered is none or
             now() - this.attributes.last_triggered > cooldown }}
    actions:
      - variables:
          cycle_started: "{{ now().isoformat() }}"
      - action: switch.turn_off
        target:
          entity_id: switch.denon_power
        continue_on_error: true
      - wait_template: "{{ is_state('switch.denon_power', 'off') }}"
        timeout: "00:00:10"
      - delay: "00:00:01"
      # A Tuya command can fail or its report can lag; the Denon must end up
      # powered, confirmed by an on report newer than this cycle.
      - repeat:
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.denon_power
              continue_on_error: true
            - wait_template: >-
                {{ is_state('switch.denon_power', 'on') and
                   states.switch.denon_power.last_changed > as_datetime(cycle_started) }}
              timeout: "00:00:20"
          until:
            - condition: template
              value_template: >-
                {{ (is_state('switch.denon_power', 'on') and
                    states.switch.denon_power.last_changed > as_datetime(cycle_started))
                   or repeat.index >= 3 }}
      - if:
          - condition: template
            value_template: >-
              {{ not (is_state('switch.denon_power', 'on') and
                      states.switch.denon_power.last_changed > as_datetime(cycle_started)) }}
        then:
          - action: notify.notify
            data:
              title: Denon power not confirmed
              message: >-
                The Denon's smart socket did not report on after a power
                cycle. Check that the Denon has power.

  - id: denon_link_alert_lost
    alias: Denon link lost alert
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.denon_bluetooth_link
        to: ["off", "unavailable"]
        for: "00:01:00"
      # A link that is already down when Home Assistant starts has no state change.
      - trigger: homeassistant
        event: start
        id: start
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - delay: "00:01:00"
          - condition: state
            entity_id: binary_sensor.denon_bluetooth_link
            state: ["off", "unavailable"]
      - action: notify.notify
        data:
          title: Denon volume control lost
          message: >-
            {% if is_state('binary_sensor.denon_bluetooth_link', 'unavailable') %}The ESP32 has not
            answered on the network for 1 minute.{% else %}The ESP32 has had no
            Bluetooth link to the Denon for 1 minute, even after its power
            cycle. Check the Denon and its smart socket.{% endif %}

  - id: denon_link_alert_restored
    alias: Denon link restored alert
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.denon_bluetooth_link
        from: ["off", "unavailable"]
        to: "on"
    conditions:
      # A maintenance boot reports the link as up without a Bluetooth link.
      - condition: state
        entity_id: binary_sensor.denon_esp32_maintenance
        state: "off"
      # Only after an outage long enough to have sent the lost alert.
      - condition: template
        value_template: >-
          {{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 60 }}
    actions:
      - action: notify.notify
        data:
          title: Denon volume control restored
          message: The ESP32 is connected to the Denon again.
